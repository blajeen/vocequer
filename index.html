<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Você quer?</title>
<meta name="description" content="Faça uma pergunta. O Não foge. O Sim cresce. Os bichinhos aparecem.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐶</text></svg>">
<style>
  :root{--bg1:#fff3e0;--bg2:#ffe1bd;--acc:#9a3412;--ink:#2b2340;--sim:#22c55e;--simd:#15803d;--nao:#ef4444;--naod:#b91c1c;--card:#ffffffcc}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;min-height:100dvh}
  body.jogo{height:100dvh;overflow:hidden}
  html{overflow-x:hidden}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);
    background:linear-gradient(135deg,var(--bg1),var(--bg2));display:flex;padding:16px;touch-action:manipulation;user-select:none}
  .card{margin:auto;position:relative;z-index:2;background:var(--card);backdrop-filter:blur(6px);border-radius:24px;padding:28px 22px;max-width:560px;width:100%;
    box-shadow:0 20px 50px #0002;text-align:center}
  .face{width:120px;height:110px;margin:0 auto 6px;transition:transform .2s}
  .dog{width:100%;height:100%;overflow:visible}
  .dog .brow{transition:transform .3s;transform-box:fill-box;transform-origin:center}
  .dog .lagrima,.dog .boca-triste,.dog .boca-feliz,.dog .lingua{opacity:0;transition:opacity .2s}
  .dog .boca-meio{transition:opacity .2s}
  .dog.triste .bl{transform:rotate(-18deg) translateY(-2px)} .dog.triste .br{transform:rotate(18deg) translateY(-2px)}
  .dog.triste .boca-meio,.dog.feliz .boca-meio{opacity:0}
  .dog.triste .boca-triste{opacity:1}
  .dog.chorando .lagrima{opacity:1;animation:pinga 1s infinite}
  @keyframes pinga{from{transform:translateY(0)}to{transform:translateY(14px);opacity:0}}
  .dog.feliz .boca-feliz,.dog.feliz .lingua{opacity:1}
  .dog.feliz{animation:pula .5s infinite alternate}
  @keyframes pula{from{transform:translateY(0) rotate(-4deg)}to{transform:translateY(-10px) rotate(4deg)}}
  .dog .orelha{transform-box:fill-box;transform-origin:center;transition:transform .3s}
  .dog .ol{transform:rotate(20deg)} .dog .or{transform:rotate(-20deg)}
  .dog.triste .ol{transform:rotate(32deg) translateY(4px)} .dog.triste .or{transform:rotate(-32deg) translateY(4px)}
  .q{width:100%;border:none;background:transparent;font-family:inherit;font-weight:800;font-size:clamp(22px,5vw,34px);line-height:1.2;color:var(--ink);text-align:center;resize:none;outline:none;
    border-bottom:3px dashed #0002;padding:6px 4px;user-select:text}
  .q:focus{border-bottom-color:#ea7a1f}
  .hint{font-size:13px;opacity:.6;margin:6px 0 22px}
  .row{display:flex;gap:18px;justify-content:center;align-items:center;min-height:90px;flex-wrap:wrap}
  button{font-family:inherit;font-weight:800;font-size:22px;line-height:1;border:none;border-radius:999px;padding:16px 34px;color:#fff;cursor:pointer;box-shadow:0 6px 0 var(--d);transition:transform .12s, box-shadow .12s}
  button:active{transform:translateY(4px);box-shadow:0 2px 0 var(--d)}
  #sim{--d:var(--simd);background:var(--sim);transition:transform .35s cubic-bezier(.3,1.6,.5,1),box-shadow .12s;transform-origin:center}
  #nao{--d:var(--naod);background:var(--nao)}
  #nao.fugindo{position:fixed;z-index:50;transition:left .35s cubic-bezier(.3,1.3,.5,1),top .35s cubic-bezier(.3,1.3,.5,1)}
  /* depois de fugir, o Não chama atenção: balança, brilha e fala "tô aqui" */
  #nao.aqui{animation:chama .45s ease-in-out 3}
  @keyframes chama{0%,100%{transform:rotate(0) scale(1)}25%{transform:rotate(-10deg) scale(1.12)}75%{transform:rotate(10deg) scale(1.12)}}
  #nao.fugindo::before{content:"";position:absolute;inset:-6px;border-radius:999px;border:3px solid var(--nao);opacity:0;pointer-events:none}
  #nao.aqui::before{animation:anel 1.3s ease-out}
  @keyframes anel{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.7)}}
  #nao{position:relative}
  #nao .fala{position:absolute;left:50%;bottom:calc(100% + 10px);transform:translateX(-50%);background:#fff;color:var(--ink);font-size:14px;
    padding:6px 10px;border-radius:12px;white-space:nowrap;box-shadow:0 4px 12px #0002;opacity:0;transition:opacity .2s;pointer-events:none}
  #nao .fala::after{content:"";position:absolute;left:50%;top:100%;margin-left:-6px;border:6px solid transparent;border-top-color:#fff}
  #nao.embaixo .fala{bottom:auto;top:calc(100% + 10px)}
  #nao.embaixo .fala::after{top:auto;bottom:100%;border-top-color:transparent;border-bottom-color:#fff}
  #nao.aqui .fala{opacity:1}
  @media (max-width:600px){button{font-size:24px;padding:18px 36px}}
  @media (max-height:720px){
    .card{padding:18px 18px}
    #card .face{width:84px;height:77px}
    .pergunta{margin:2px 0 12px;font-size:clamp(22px,6vw,30px)}
    .row{min-height:70px}
    .msg{margin-top:10px}
  }
  .msg{min-height:28px;margin-top:20px;font-weight:700;font-size:18px;color:var(--acc)}
  .bicho{position:fixed;z-index:1;pointer-events:none;font-size:42px;will-change:transform,opacity}
  .pop{animation:pop 2.6s ease-out forwards}
  @keyframes pop{0%{transform:scale(0) rotate(0)}15%{transform:scale(1.3) rotate(-15deg)}30%{transform:scale(1) rotate(10deg)}
    80%{opacity:1;transform:translateY(-40px) rotate(-5deg)}100%{opacity:0;transform:translateY(-90px) rotate(0)}}
  .corre{animation:corre linear forwards}
  @keyframes corre{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
  .chuva{animation:chuva linear forwards}
  @keyframes chuva{from{transform:translateY(-10vh) rotate(0)}to{transform:translateY(115vh) rotate(var(--r))}}
  .vitoria{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;flex-direction:column;padding:16px;text-align:center;
    background:radial-gradient(circle,#fffbeb 0,#fde68a 75%)}
  .vitoria.on{display:flex;animation:fade .4s}
  @keyframes fade{from{opacity:0}}
  .vitoria h1{font-size:clamp(34px,9vw,72px);margin:0 0 8px;color:var(--acc);animation:pulsa 1s infinite}
  @keyframes pulsa{50%{transform:scale(1.08)}}
  .vitoria p{font-size:20px;margin:0 0 20px}
  @keyframes danca{from{transform:rotate(-15deg)}to{transform:rotate(15deg) translateY(-10px)}}
  .acoes{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .acoes button,.acoes a{font-size:16px;padding:12px 22px;--d:#9a3412;background:#ea7a1f}
  .tremer{animation:tremer .3s}
  @keyframes tremer{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
  .criar h2{margin:0 0 4px;font-size:clamp(22px,5vw,30px)}
  .criar .sub{opacity:.7;margin:0 0 16px}
  .criar .q{border:2px solid #0001;border-radius:16px;background:#fff;padding:12px;font-size:20px}
  .gerar{margin-top:16px;--d:#9a3412;background:#ea7a1f}
  .link{display:none;margin-top:18px;text-align:left}
  .link.on{display:block}
  .link input{width:100%;font:inherit;font-size:14px;padding:12px;border-radius:12px;border:2px solid #0001;background:#f8fafc;user-select:all}
  .link .acoes{margin-top:10px}
  .link .acoes a,.link .acoes button{font-size:15px;padding:11px 18px}
  a.btn{display:inline-block;text-decoration:none;color:#fff;font-weight:800;border-radius:999px;box-shadow:0 6px 0 var(--d)}
  .acoes .zap{--d:#15803d;background:#22c55e}
  #contar{font-size:19px;padding:15px 26px}
  .pergunta{font-weight:800;font-size:clamp(24px,6vw,38px);line-height:1.2;margin:4px 0 22px;word-break:break-word}
  [hidden]{display:none!important}
  .campos{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
  .campos label{flex:1 1 180px;text-align:left;font-size:13px;font-weight:700;opacity:.8}
  .campos input{display:block;width:100%;margin-top:4px;font:inherit;font-size:16px;padding:10px 12px;border-radius:12px;border:2px solid #0001;background:#fff;user-select:text}
  .de{font-size:15px;opacity:.7;margin:0}
</style>
</head>
<body>
<!-- MODO 1: criar a pergunta e gerar o link -->
<main class="card criar" id="criar" hidden>
  <div class="face"><svg class="dog feliz"></svg></div>
  <h2>Faça sua pergunta</h2>
  <p class="sub">Escreva, gere o link e mande pra pessoa. O cachorrinho só aceita Sim 🐶</p>
  <textarea class="q" id="q" rows="2" maxlength="140" spellcheck="false" placeholder="Ex.: Vamos no churrasco sábado?">Bora tomar um açaí hoje?</textarea>
  <div class="campos">
    <label>Seu nome (opcional)<input id="nome" maxlength="30" placeholder="Ex.: João"></label>
    <label>Seu WhatsApp, pra receber a resposta<input id="zapnum" inputmode="tel" maxlength="20" placeholder="(11) 91234-5678"></label>
  </div>
  <button class="gerar" id="gerar">Gerar link 🔗</button>
  <div class="link" id="link">
    <input id="url" readonly>
    <div class="acoes">
      <button id="copiar">📋 Copiar</button>
      <a class="btn zap" id="zap" target="_blank" rel="noopener">💬 WhatsApp</a>
      <a class="btn" id="testar" target="_blank" rel="noopener">👀 Testar</a>
    </div>
  </div>
</main>

<!-- MODO 2: quem recebeu o link responde -->
<main class="card" id="card" hidden>
  <div class="face"><svg class="dog" id="dog"></svg></div>
  <p class="de" id="de" hidden></p>
  <div class="pergunta" id="pergunta"></div>
  <div class="row">
    <button id="sim">Sim</button>
    <button id="nao"><span class="txt">Não</span><span class="fala">tô aqui 😜</span></button>
  </div>
  <div class="msg" id="msg"></div>
</main>

<section class="vitoria" id="vitoria">
  <div class="face" style="width:170px;height:155px"><svg class="dog feliz"></svg></div>
  <h1>EBAAAA! 🐾</h1>
  <p id="vitoriaTxt">Eu sabia que você ia dizer sim!</p>
  <div class="acoes">
    <a class="btn zap" id="contar" target="_blank" rel="noopener" hidden></a>
    <button id="minha">✨ Fazer a minha pergunta</button>
  </div>
</section>

<script>
const $ = s => document.querySelector(s);
const BICHOS = ['🐶','🐕','🦮','🐕‍🦺','🐩','🐶','🐕','🦴','🐾','🎾','🐶','🐕','🦴','🐾'];
const FRASES = [
  'Ops, o Não saiu correndo 🐕','Tem certeza?? 🥺','Olha a carinha dele...','O cachorrinho tá esperando um Sim 🐾',
  'Fugiu igual cachorro na hora do banho 🛁','Nem vem! 🙅','O Não foi buscar a bolinha 🎾','O caramelo tá chorando 😭',
  'Só tem uma resposta certa 👉','O Sim tá ficando enorme 👀','Desiste, vai 🥹','Erro 404: Não não encontrado',
  'Os doguinhos estão do lado do Sim 🐶🐶','Já chamei a matilha toda 🐕🐕🐕','Você é teimoso(a), hein!',
  'O Não foi enterrado no quintal 🦴','Ok, agora é pessoal 😤','Aperta o verde ✅'
];
// Desenho do vira-lata caramelo (muda de carinha com as classes triste / chorando / feliz)
const DOG = `<svg viewBox="0 0 120 110">
  <ellipse class="orelha ol" cx="26" cy="46" rx="13" ry="26" fill="#a85a1c"/>
  <ellipse class="orelha or" cx="94" cy="46" rx="13" ry="26" fill="#a85a1c"/>
  <ellipse cx="60" cy="58" rx="37" ry="34" fill="#e0913f"/>
  <ellipse cx="60" cy="33" rx="9" ry="12" fill="#f6d3a8"/>
  <ellipse cx="60" cy="76" rx="21" ry="15" fill="#f6d3a8"/>
  <circle cx="46" cy="54" r="6" fill="#2b1a10"/><circle cx="74" cy="54" r="6" fill="#2b1a10"/>
  <circle cx="48" cy="52" r="2.2" fill="#fff"/><circle cx="76" cy="52" r="2.2" fill="#fff"/>
  <rect class="brow bl" x="39" y="42" width="13" height="3" rx="1.5" fill="#7a3f12"/>
  <rect class="brow br" x="68" y="42" width="13" height="3" rx="1.5" fill="#7a3f12"/>
  <ellipse cx="60" cy="68" rx="7" ry="5" fill="#2b1a10"/>
  <path class="boca-meio" d="M52 78 Q56 81 60 77 Q64 81 68 78" stroke="#2b1a10" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <path class="boca-triste" d="M51 84 Q60 76 69 84" stroke="#2b1a10" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <path class="lingua" d="M55 80 Q55 94 60 94 Q65 94 65 80 Z" fill="#f472b6"/>
  <path class="boca-feliz" d="M49 77 Q60 88 71 77" stroke="#2b1a10" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <ellipse class="lagrima" cx="44" cy="64" rx="3" ry="4.5" fill="#60a5fa"/>
  <ellipse class="lagrima" cx="76" cy="64" rx="3" ry="4.5" fill="#60a5fa"/>
</svg>`;
document.querySelectorAll('svg.dog').forEach(el => { el.innerHTML = DOG.replace(/^<svg[^>]*>|<\/svg>$/g,''); el.setAttribute('viewBox','0 0 120 110'); });
// Os 5 lugares para onde o Não foge, em loop (em % da tela: [horizontal, vertical])
const FALAS = ['tô aqui 😜','me pega! 🐕','aqui ó 👋','quase! 😂','tenta de novo 🎾'];
const rand = (a,b) => Math.random()*(b-a)+a;
const pick = a => a[Math.floor(Math.random()*a.length)];

function bicho(x, y, cls='pop', extra={}) {
  const el = document.createElement('div');
  el.className = 'bicho ' + cls;
  el.textContent = pick(BICHOS);
  el.style.left = x+'px'; el.style.top = y+'px';
  el.style.fontSize = (extra.size||rand(30,56))+'px';
  Object.entries(extra.vars||{}).forEach(([k,v]) => el.style.setProperty(k,v));
  if (extra.dur) el.style.animationDuration = extra.dur+'s';
  document.body.appendChild(el);
  el.addEventListener('animationend', () => el.remove());
}
function bichoCorrendo() {
  const daEsq = Math.random() < .5, w = innerWidth;
  bicho(daEsq ? -60 : w+10, rand(innerHeight*.1, innerHeight*.9), 'corre',
    {vars:{'--dx': (daEsq ? w+120 : -(w+120))+'px'}, dur: rand(2,4), size: rand(36,60)});
}
setInterval(() => { if (Math.random() < .5) bichoCorrendo(); }, 3500);

const params = new URLSearchParams(location.search);
const pergunta = (params.get('q') || '').trim().slice(0,140);
const nomeDono = (params.get('n') || '').trim().slice(0,30);
const zapDono = (params.get('w') || '').replace(/\D/g,'').slice(0,15);

if (!pergunta) {
  // ---------- MODO CRIAR ----------
  $('#criar').hidden = false;
  const q = $('#q');
  const autoAjuste = () => { q.style.height='auto'; q.style.height = q.scrollHeight+'px'; };
  q.addEventListener('input', () => { autoAjuste(); $('#link').classList.remove('on'); });
  autoAjuste();
  $('#gerar').addEventListener('click', () => {
    const txt = q.value.trim();
    if (!txt) { q.focus(); q.classList.add('tremer'); setTimeout(()=>q.classList.remove('tremer'),300); return; }
    const u = new URLSearchParams({q: txt});
    const nome = $('#nome').value.trim();
    let num = $('#zapnum').value.replace(/\D/g,'');
    if (num.length === 10 || num.length === 11) num = '55' + num;   // número BR sem o 55
    if (nome) u.set('n', nome);
    if (num.length >= 10) u.set('w', num);
    const url = location.origin + location.pathname + '?' + u.toString();
    $('#url').value = url;
    $('#testar').href = url;
    $('#zap').href = 'https://wa.me/?text=' + encodeURIComponent('Tenho uma pergunta pra você 🐶👉 ' + url);
    $('#link').classList.add('on');
    for (let i=0;i<5;i++) bicho(rand(0, innerWidth-50), rand(0, innerHeight-50));
  });
  $('#copiar').addEventListener('click', async e => {
    try { await navigator.clipboard.writeText($('#url').value); e.target.textContent = '✅ Copiado!'; }
    catch { $('#url').select(); document.execCommand('copy'); e.target.textContent = '✅ Copiado!'; }
    setTimeout(() => e.target.textContent = '📋 Copiar', 2000);
  });
} else {
  // ---------- MODO RESPONDER ----------
  $('#card').hidden = false;
  document.body.classList.add('jogo');
  $('#pergunta').textContent = pergunta;
  document.title = pergunta;
  if (nomeDono) { $('#de').textContent = nomeDono + ' quer saber:'; $('#de').hidden = false; }
  const sim = $('#sim'), nao = $('#nao'), msg = $('#msg'), dog = $('#dog');
  let fugas = 0, escala = 1;

  function lugares() {
    const vw = innerWidth, vh = innerHeight, pad = 14;
    const w = nao.offsetWidth, h = nao.offsetHeight;
    const c = $('#card').getBoundingClientRect();
    const celular = vw < 600;
    // espaço livre acima e abaixo do cartão
    const yTop = c.top >= h + pad*2 ? Math.max(pad, (c.top - h)/2) : pad;
    const yBot = vh - c.bottom >= h + pad*2 ? c.bottom + (vh - c.bottom - h)/2 : vh - h - pad;
    const margem = celular ? pad : Math.max(pad, (c.left - w)/2);
    const xl = margem, xr = vw - w - margem, xc = (vw - w)/2;
    return [[xl,yTop],[xr,yTop],[xr,yBot],[xl,yBot],[xc,yBot]]
      .map(([x,y]) => [Math.min(Math.max(pad,x), vw-w-pad), Math.min(Math.max(pad,y), vh-h-pad)]);
  }

  function fugir(e) {
    if (e) e.preventDefault();
    if (fugir.cool) return;            // evita contar 2x no mesmo toque
    fugir.cool = true; setTimeout(() => fugir.cool = false, 200);
    fugas++;
    if (nao.parentNode !== document.body) {
      // tira o botão de dentro do cartão para ele poder andar pela tela toda
      const r = nao.getBoundingClientRect();
      document.body.appendChild(nao);
      nao.classList.add('fugindo');
      nao.style.left = r.left+'px'; nao.style.top = r.top+'px';
      void nao.offsetWidth;
    }
    // Pula entre 5 lugares em loop, sempre nas áreas livres (acima/abaixo do cartão),
    // para não ficar escondido atrás do cartão nem fora da tela no celular
    const L = lugares();
    const [x, y] = L[(fugas-1) % L.length];
    nao.style.left = x+'px'; nao.style.top = y+'px';
    nao.classList.toggle('embaixo', y < 70);   // balão vai pra baixo se o botão estiver colado no topo
    nao.querySelector('.fala').textContent = FALAS[(fugas-1) % FALAS.length];
    nao.classList.remove('aqui'); clearTimeout(fugir.t);
    fugir.t = setTimeout(() => { void nao.offsetWidth; nao.classList.add('aqui');
      fugir.t = setTimeout(() => nao.classList.remove('aqui'), 1500); }, 350);

    escala = Math.min(escala + .15, 2.2);
    sim.style.transform = `scale(${escala})`;

    msg.textContent = FRASES[(fugas-1) % FRASES.length];
    dog.classList.add('triste');
    if (fugas >= 3) dog.classList.add('chorando');
    if (fugas >= 6) nao.querySelector('.txt').textContent = pick(['Não','Nãoo','Nem','N-não','Nop','🙈']);
    const n = Math.min(2 + Math.floor(fugas/2), 8);
    for (let i=0;i<n;i++) bicho(rand(0, innerWidth-50), rand(0, innerHeight-50));
    if (fugas % 3 === 0) bichoCorrendo();
    if (fugas % 5 === 0) { document.body.classList.add('tremer'); setTimeout(()=>document.body.classList.remove('tremer'),300); }
    if (navigator.vibrate) navigator.vibrate(30);
  }
  nao.addEventListener('mouseenter', fugir);
  nao.addEventListener('pointerdown', fugir);
  nao.addEventListener('touchstart', fugir, {passive:false});
  nao.addEventListener('click', fugir);

  sim.addEventListener('click', () => {
    $('#vitoriaTxt').textContent = fugas === 0
      ? 'De primeira! Nem precisou fugir 😎'
      : `Depois de ${fugas} tentativa${fugas>1?'s':''} de clicar no Não... mas o caramelo sabia que era SIM! 🐶`;
    if (zapDono) {
      const tent = fugas === 0 ? 'de primeira 😎' : `depois de tentar clicar no Não ${fugas} vez${fugas>1?'es':''} 😂`;
      const txt = `Respondi SIM pra "${pergunta}" 🐶 (${tent})`;
      const c = $('#contar');
      c.href = `https://wa.me/${zapDono}?text=` + encodeURIComponent(txt);
      c.textContent = '💬 Contar pra ' + (nomeDono || 'quem perguntou');
      c.hidden = false;
    }
    $('#vitoria').classList.add('on');
    nao.style.display = 'none';
    const chover = () => { for (let i=0;i<6;i++) bicho(rand(0, innerWidth-40), 0, 'chuva', {vars:{'--r': rand(-360,360)+'deg'}, dur: rand(2.5,5), size: rand(28,64)}); };
    chover(); setInterval(chover, 350);
      });
  $('#minha').addEventListener('click', () => { location.href = location.pathname; });
}
</script>
</body>
</html>
